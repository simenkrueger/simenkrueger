<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>羽生结弦 · 资料库</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- ===== 头部 ===== -->
    <div class="site-header">
      <div>
        <span class="logo-main"><i class="fas fa-skating"></i> 羽生结弦 · 资料库</span>
        <span class="logo-sub">ファン資料庫 · EST. 2026</span>
      </div>
      <div style="font-size:0.8rem; color:#5b6f82;">
        <i class="fas fa-database"></i> 数据来源: events.json
        <span style="margin-left:0.8rem;"><i class="fab fa-github"></i> GitHub</span>
      </div>
    </div>

    <!-- ===== 导航 ===== -->
    <div class="nav-links">
      <a href="#" class="active">首页TOP</a>
      <a href="#">新闻NEWS</a>
      <a href="#">日历CALENDAR</a>
      <a href="#">今日纪念日</a>
      <a href="#">资料库DATABASE</a>
      <a href="#">友联LINKS</a>
      <a href="#">随机条目</a>
      <a href="#">提交订正</a>
    </div>

    <!-- ===== 筛选器 ===== -->
    <div class="filter-section">
      <div class="filter-row">
        <span class="label"><i class="fas fa-tag"></i> 类别</span>
        <span class="filter-tag active" data-filter="all">全部</span>
        <span class="filter-tag" data-filter="比赛">🏆 比赛</span>
        <span class="filter-tag" data-filter="冰演">⛸️ 冰演</span>
        <span class="filter-tag" data-filter="采访">🎤 采访</span>
        <span class="filter-tag" data-filter="展览">🖼️ 展览</span>
      </div>
      <div class="filter-row" style="margin-top:0.6rem;">
        <span class="label"><i class="fas fa-calendar-alt"></i> 赛季</span>
        <span class="filter-tag active" data-season="all">全部</span>
        <span class="filter-tag" data-season="2025-2026">2025-2026</span>
        <span class="filter-tag" data-season="2024-2025">2024-2025</span>
        <span class="filter-tag" data-season="2023-2024">2023-2024</span>
      </div>
    </div>

    <!-- ===== 视图切换 ===== -->
    <div class="view-controls">
      <div>
        <button class="view-btn active" data-view="list"><i class="fas fa-list"></i> 列表</button>
        <button class="view-btn" data-view="grid"><i class="fas fa-th"></i> 卡片</button>
      </div>
      <div style="font-size:0.85rem; color:#6b839b;">
        <span id="result-count">加载中...</span>
      </div>
    </div>

    <!-- ===== 内容区域 ===== -->
    <div id="content-area">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载数据中...</div>
    </div>

    <!-- ===== 底部 ===== -->
    <div class="footer-meta">
      <div><i class="fas fa-skating"></i> 羽生结弦 HANYU YUZURU · 非官方资料库</div>
      <div>
        <i class="fas fa-file-code"></i> 数据: events.json
        <span class="github-badge"><i class="fas fa-cloud"></i> Cloudflare Pages</span>
      </div>
    </div>
  </div>

  <!-- ===== JavaScript ===== -->
  <script src="script.js"></script>
</body>
</html>
