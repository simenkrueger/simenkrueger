<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simen Hegstad Krüger · 资料库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <!-- ===== 头部 ===== -->
        <div class="site-header">
            <div>
                <span class="logo-main"><i class="fas fa-skiing-nordic"></i> Simen Hegstad Krüger · 资料库</span>
                <span class="logo-sub">1993.03.13 · 挪威越野滑雪</span>
            </div>
            <div style="font-size:0.8rem; color:#5b6f82;">
                <i class="fas fa-database"></i> 数据: JSON
                <span style="margin-left:0.8rem;"><i class="fab fa-github"></i> GitHub</span>
            </div>
        </div>

        <!-- ===== 导航 ===== -->
        <div class="nav-links">
            <a href="#" class="active">首页TOP</a>
            <a href="#">新闻NEWS</a>
            <a href="#">日历CALENDAR</a>
            <a href="#">资料库DATABASE</a>
        </div>

        <!-- ===== 筛选区域 ===== -->
        <div class="filter-section">
            <!-- 类别筛选 -->
            <div class="filter-row">
                <span class="label"><i class="fas fa-tag"></i> 类别</span>
                <span class="filter-tag active" data-filter="all">全部</span>
                <span class="filter-tag" data-filter="世界杯">🏆 世界杯</span>
                <span class="filter-tag" data-filter="奥运会">🥇 奥运会</span>
                <span class="filter-tag" data-filter="世锦赛">❄️ 世锦赛</span>
                <span class="filter-tag" data-filter="全国锦标赛">🇳🇴 全国锦标赛</span>
                <span class="filter-tag" data-filter="其他">⛷️ 其他</span>
                <span class="filter-tag" data-filter="夏季比赛">🛼 夏季比赛</span>
            </div>

            <!-- 赛季筛选 -->
            <div class="filter-row" style="margin-top:0.6rem;">
                <span class="label"><i class="fas fa-calendar-alt"></i> 赛季</span>
                <span id="season-tags-container">
                    <!-- 由 JavaScript 动态生成 -->
                </span>
            </div>

            <!-- 标签筛选 -->
            <div class="filter-row" style="margin-top:0.6rem; flex-wrap: wrap;">
                <span class="label"><i class="fas fa-tags"></i> 标签</span>
                <span id="tag-container">
                    <!-- 由 JavaScript 动态生成 -->
                </span>
            </div>
        </div>

        <!-- ===== 视图切换 ===== -->
        <div class="view-controls">
            <div>
                <button class="view-btn active" data-view="list"><i class="fas fa-list"></i> 列表</button>
                <button class="view-btn" data-view="grid"><i class="fas fa-th"></i> 卡片</button>
            </div>
            <div style="font-size:0.85rem; color:#6b839b;">
                <span id="result-count">加载中...</span>
            </div>
        </div>

        <!-- ===== 内容区域 ===== -->
        <div id="content-area">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载数据中...</div>
        </div>

        <!-- ===== 分页控件 ===== -->
        <div id="pagination-container" style="margin-top: 1rem; text-align: center;"></div>

        <!-- ===== 底部 ===== -->
        <div class="footer-meta">
            <div><i class="fas fa-skiing-nordic"></i> Simen Hegstad Krüger · 非官方资料库</div>
            <div>
                <i class="fas fa-file-code"></i> 数据: JSON
                <span class="github-badge"><i class="fas fa-cloud"></i> Cloudflare Pages</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
